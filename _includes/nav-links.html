{%- comment -%} Temas (desde _data/temas.yml), archivo y «Sobre mí». {%- endcomment -%}
{%- for t in site.data.temas -%}

{%- endfor -%}
<a class="nav-archivo" href="{{ '/archivo/' | relative_url }}"{% if page.url == '/archivo/' %} aria-current="page"{% endif %}>Archivo</a>
<a class="nav-sobre-mi" href="{{ '/sobre-mi/' | relative_url }}"{% if page.url == '/sobre-mi/' %} aria-current="page"{% endif %}>Sobre mí</a>
