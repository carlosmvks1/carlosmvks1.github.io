{% assign cat = include.cat | default: 'cuaderno' %}
<span class="category-mark category-mark--{{ cat }}{% if include.large %} category-mark--large{% endif %}" aria-hidden="true">
{% case cat %}
  {% when 'medicina' %}
    <svg viewBox="0 0 64 64" role="img" focusable="false">
      <path d="M8 34h11l5-13 9 25 7-17 5 5h11" />
      <circle cx="32" cy="32" r="25" />
    </svg>
  {% when 'filosofia' %}
    <svg viewBox="0 0 64 64" role="img" focusable="false">
      <circle cx="20" cy="22" r="8" />
      <circle cx="44" cy="22" r="8" />
      <circle cx="32" cy="44" r="8" />
      <path d="M27 26.5 30 37M37 26.5 34 37M28 22h8" />
    </svg>
  {% when 'fe' %}
    <svg viewBox="0 0 64 64" role="img" focusable="false">
      <path d="M32 8v48M19 23h26" />
      <path d="M14 49c9-7 27-7 36 0" />
    </svg>
  {% when 'proyectos' %}
    <svg viewBox="0 0 64 64" role="img" focusable="false">
      <path d="M13 17h17v17H13zM34 30h17v17H34z" />
      <path d="M30 25h11M24 34v11" />
    </svg>
  {% else %}
    <svg viewBox="0 0 64 64" role="img" focusable="false">
      <path d="M17 13h30v38H17zM24 23h16M24 31h16M24 39h10" />
    </svg>
{% endcase %}
</span>
