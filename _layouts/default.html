<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
  <head>
    {% include head.html %}
  </head>
  <body class="layout-{{ page.layout | default: 'page' }}">
    <header class="site-header">
      <div class="site-shell header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">El cuaderno</a>

        <nav class="desktop-nav" aria-label="Navegación principal">
          <a href="{{ '/medicina/' | relative_url }}">Medicina</a>
          <a href="{{ '/filosofia/' | relative_url }}">Filosofía</a>
          <a href="{{ '/fe_y_etica/' | relative_url }}">Fe y ética</a>
          <a href="{{ '/proyectos/' | relative_url }}">Proyectos</a>
          <a href="{{ '/sobre-mi/' | relative_url }}">Sobre mí</a>
        </nav>

        <details class="mobile-menu">
          <summary>Menú</summary>
          <nav aria-label="Navegación móvil">
            <a href="{{ '/medicina/' | relative_url }}">Medicina</a>
            <a href="{{ '/filosofia/' | relative_url }}">Filosofía</a>
            <a href="{{ '/fe_y_etica/' | relative_url }}">Fe y ética</a>
            <a href="{{ '/proyectos/' | relative_url }}">Proyectos</a>
            <a href="{{ '/sobre-mi/' | relative_url }}">Sobre mí</a>
          </nav>
        </details>
      </div>
    </header>

    <main id="contenido">
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
