---
layout: default
---
<section class="archivo shell">
  <header class="pagina-cabeza">
    <p class="eyebrow">Índice</p>
    <h1>{{ page.title }}</h1>
    <p class="deck" id="archivo-cuenta" data-total="{{ site.posts.size }}">{{ site.posts.size }} entradas, de la más reciente a la más antigua.</p>
  </header>

  <div class="filtros" role="group" aria-label="Filtrar por tema" hidden>
    <button type="button" aria-pressed="true" data-filtro="todos">Todos</button>
    {%- for t in site.data.temas %}
    <button type="button" aria-pressed="false" data-filtro="{{ t.clave }}" data-nombre="{{ t.nombre }}" class="tema--{{ t.clave }}">{{ t.nombre }}</button>
    {%- endfor %}
  </div>

  <p class="solo-lectores" role="status" id="archivo-estado"></p>

  {% include archive-list.html posts=site.posts %}
</section>
